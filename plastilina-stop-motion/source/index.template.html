<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: {{W}}px;
        height: {{H}}px;
        overflow: hidden;
        background: #24170f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #plato {
        position: absolute;
        left: 0;
        top: 0;
        width: {{W}}px;
        height: {{H}}px;
        object-fit: cover;
        z-index: 1;
      }
      #camina,
      #saluda {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <!-- {{DUR}} s at {{FPS}} fps ({{FRAMES}} frames), one locked-off shot on a clay miniature set:
         Nico walks along the cobbles (scene "camina"), stops and waves (scene "saluda"). -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DUR}}"
      data-fps="{{FPS}}"
      data-width="{{W}}"
      data-height="{{H}}"
    >
      <img
        id="plato"
        class="clip"
        src="assets/plate/plato.jpg"
        alt="Plató de plastilina: acera empedrada frente a una casita de ladrillo"
        data-start="0"
        data-duration="{{DUR}}"
        data-track-index="0"
        {{PLATE_GRADING}}
      />
{{HOSTS}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Set-light flicker of a stop-motion shoot: one small exposure offset per photographed
      // frame (exposure), stepped with tl.set, deterministic (values come from the x-sheet build).
      const luz = {{LUZ_JSON}};
      for (const [t, v] of luz) tl.set("#plato", { "--hf-color-grading-exposure": v }, t);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
